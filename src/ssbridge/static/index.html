<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SmartShell Bridge</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="icon.svg" alt="" width="34" height="34">
      <div><div class="brand-name">SmartShell Bridge</div><div class="brand-sub" id="version">v2</div></div>
    </div>
    <nav id="nav">
      <a data-page="dashboard" class="active"><i data-i="grid"></i><span>Обзор</span></a>
      <a data-page="bindings"><i data-i="link"></i><span>Хосты</span></a>
      <a data-page="systems"><i data-i="home"></i><span>Умный дом</span></a>
      <a data-page="smartshell"><i data-i="monitor"></i><span>SmartShell</span></a>
      <a data-page="logs"><i data-i="list"></i><span>Журнал</span><b class="badge" id="log-badge" hidden></b></a>
      <a data-page="diag"><i data-i="check"></i><span>Диагностика</span></a>
      <a data-page="settings"><i data-i="gear"></i><span>Настройки</span></a>
    </nav>
    <div class="side-foot">
      <div class="status-pill" id="status-pill"><span class="dot"></span><span id="status-text">Подключение…</span></div>
      <button class="btn ghost sm" id="theme-toggle" title="Тема"><i data-i="moon"></i></button>
      <button class="btn ghost sm" id="app-lock" title="Заблокировать (потребуется пароль)" hidden><i data-i="lock"></i></button>
      <button class="btn ghost sm" id="app-quit" title="Выйти из программы"><i data-i="power"></i></button>
    </div>
  </aside>
  <main>
    <div class="banner" id="banner" hidden></div>
    <section id="page"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<div id="login" hidden><form class="login-box" id="login-form" autocomplete="off" onsubmit="return false">
  <img src="icon.svg" alt="" width="56" height="56">
  <h2 id="login-title">Вход в программу</h2><p class="muted" id="login-hint"></p>
  <input type="text" data-secret autocomplete="off" spellcheck="false" id="login-in" placeholder="Пароль">
  <div id="login-err"></div>
  <button class="btn primary" id="login-ok" type="submit"><i data-i="lock"></i>Войти</button>
  <p class="small muted" id="login-forgot">Забыли пароль? На этом компьютере выполните<br><code>SmartShellBridge.exe --reset-password</code></p></form></div>
<div id="closed" hidden><div class="closed-box"><img src="icon.svg" alt="" width="48" height="48">
  <h2>SmartShell Bridge закрыт</h2><p class="muted">Программа не запущена. Окно можно закрыть.</p>
  <div class="row" style="justify-content:center"><button class="btn primary" id="closed-close">Закрыть окно</button><button class="btn" id="closed-retry">Переподключиться</button></div></div></div>
<script src="app.js"></script>
</body>
</html>

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # релиз публикует владелец репозитория, CI только собирает файлы

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: |
          python build/make_icon.py
          python -m PyInstaller --noconfirm --clean --distpath build/dist --workpath build/work build/SmartShellBridge.spec
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/dist/SmartShellBridge -DestinationPath dist/SmartShellBridge.zip
      - name: Installer
        run: |
          $version = python -c "import sys; sys.path.insert(0,'src'); import ssbridge; print(ssbridge.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Q "/DAppVersion=$version" build/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SmartShellBridge
          path: |
            dist/SmartShellBridge-Setup-*.exe
            dist/SmartShellBridge.zip

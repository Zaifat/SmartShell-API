name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Build
        run: |
          python build/make_icon.py
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/work build/SmartShellBridge.spec
          Compress-Archive -Path dist/SmartShellBridge -DestinationPath dist/SmartShellBridge.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SmartShellBridge
          path: dist/SmartShellBridge/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartShellBridge.zip
          generate_release_notes: true
